services:
  postgres:
    image: postgres:16-alpine
    container_name: sunscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunscout
      POSTGRES_USER: sunscout
      POSTGRES_PASSWORD: sunscout
    ports:
      - "55432:5432"
    volumes:
      - sunscout-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunscout -d sunscout"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 8787
      DATABASE_URL: postgresql://sunscout:sunscout@postgres:5432/sunscout
    ports:
      - "8787:8787"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sunscout.rule=Host(`usolei362859c24hssx15rj8.100.91.243.82.sslip.io`)"
      - "traefik.http.routers.sunscout.entryPoints=http"
      - "traefik.http.services.sunscout.loadbalancer.server.port=8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sunscout-postgres-data:
