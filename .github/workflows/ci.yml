name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sunscout
          POSTGRES_USER: sunscout
          POSTGRES_PASSWORD: sunscout
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sunscout -d sunscout"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://sunscout:sunscout@127.0.0.1:55432/sunscout
      API_PORT: 8787
      VITE_API_URL: http://127.0.0.1:8787/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migrate + seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build
        run: npm run build
